<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sheraos · Foto de Perfil Instagram</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000}
body{display:flex;align-items:center;justify-content:center;min-height:100vh}

.post{
  width:1080px;height:1080px;
  background:radial-gradient(circle at 50% 45%, #1A2340 0%, #0F172A 55%, #0B1226 100%);
  position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}

/* Grid sutil */
.post::before{
  content:'';position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:90px 90px;
  mask-image:radial-gradient(circle at 50% 50%, black 30%, transparent 75%);
  -webkit-mask-image:radial-gradient(circle at 50% 50%, black 30%, transparent 75%);
  pointer-events:none;
}

/* Glow azul atrás do icone */
.glow{
  position:absolute;top:50%;left:50%;
  width:780px;height:780px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(circle, rgba(37,99,235,.45) 0%, rgba(37,99,235,.15) 35%, transparent 70%);
  filter:blur(30px);
  pointer-events:none;
}

/* Anel decorativo sutil */
.ring{
  position:absolute;top:50%;left:50%;
  width:720px;height:720px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  border:2px solid rgba(96,165,250,.18);
  pointer-events:none;
}
.ring::before{
  content:'';position:absolute;inset:-40px;
  border-radius:50%;
  border:1px solid rgba(96,165,250,.08);
}

/* Icone */
.icon{
  position:relative;z-index:2;
  width:480px;height:480px;
  display:flex;align-items:center;justify-content:center;
  filter:drop-shadow(0 12px 40px rgba(37,99,235,.55));
}
.icon img{
  width:100%;height:100%;object-fit:contain;
  filter:brightness(1.1);
}
</style>
</head>
<body>
<div class="post">
  <div class="glow"></div>
  <div class="ring"></div>
  <div class="icon">
    <img src="icone-sheraos-branco.png" alt="Sheraos">
  </div>
</div>
</body>
</html>
