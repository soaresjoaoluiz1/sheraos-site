<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sheraos · Post 02 · Pain Hook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
</head>
<body>
<div class="post">
  <div class="glow-red"></div>
  <div class="glow-2"></div>

  <div class="header">
    <div class="logo">
      <img src="logo-sheraos.png" alt="Sheraos">
      <span class="brand">SHERAOS</span>
    </div>
    <div class="pill red"><span class="dot"></span> Pra você dono de empresa</div>
  </div>

  <div class="main">
    <div class="kicker red">A pergunta que dói</div>
    <h1 class="med">
      <span class="br">Você investe</span>
      <span class="br">em marketing</span>
      <span class="br">mas o <span class="gr-red">faturamento</span></span>
      <span class="br"><span class="gr-red">não acompanha?</span></span>
    </h1>
    <p class="sub">Se a resposta foi sim, <strong>provavelmente o problema não é falta de esforço, é falta de método.</strong></p>
  </div>

  <div class="footer">
    <div class="stat">
      <span class="n">3 armadilhas</span>
      <span class="l">Que mais derrubam negócios</span>
    </div>
    <div class="handle">
      <span class="h">sheraos.com.br</span>
      <span class="l">@sheraosagencia</span>
    </div>
  </div>
</div>
</body>
</html>
